# Reference copy of the tty1 autologin drop-in that install.sh writes to
# /etc/systemd/system/getty@tty1.service.d/autologin.conf (with the real user
# substituted for "pi"). This auto-logs-in the frame user on tty1 so the
# ~/.bash_profile hook can launch frame.sh on a console that owns tty1 — which
# fbi requires under full KMS. See deploy/frame.sh for the full rationale.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin pi --noclear %I $TERM
